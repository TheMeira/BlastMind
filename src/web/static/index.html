<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlastMind</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #070714;
        }
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #game-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="/static/js/vendor/webfont.js"></script>
    <script src="/static/js/vendor/phaser.min.js"></script>
    <script src="/static/js/MenuScene.js"></script>
    <script src="/static/js/GameScene.js"></script>
    <script src="/static/js/GameOverScene.js"></script>
    <script src="/static/js/SettingsScene.js"></script>
    <script src="/static/js/HelpScene.js"></script>
    <script src="/static/js/AgentSelectScene.js"></script>
    <script src="/static/js/MultiAgentScene.js"></script>
    <script src="/static/js/ComparisonScene.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
